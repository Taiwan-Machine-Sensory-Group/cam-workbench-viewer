<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <title>CAM Workbench</title>
  <style>
    body{margin:0;background:#f3f5f8;color:#17273b;font:16px/1.7 system-ui,sans-serif}
    #gate{max-width:680px;margin:8vh auto;padding:32px}h1{letter-spacing:.05em;font-size:28px}
    small,label{color:#52647a}label{display:block;margin:24px 0 8px;font-size:14px}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #8c9caf;border-radius:6px;font:inherit}
    button{margin:12px 8px 0 0;padding:10px 18px;border:1px solid #235d9c;border-radius:6px;background:#235d9c;color:white;font:inherit;cursor:pointer}
    #retry{background:transparent;color:#235d9c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f8}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main id="gate">
    <h1>CAM WORKBENCH</h1>
    <p id="status" role="status">正在開啟分享專案… / Opening shared projects… / Đang mở dự án…</p>
    <small>請使用擁有者提供的完整專用網址。<br>Use the complete private link provided by the owner.<br>Sử dụng liên kết đầy đủ do chủ sở hữu cung cấp.</small>
    <section id="recovery" hidden>
      <form id="link-form">
        <label for="share-link">完整分享網址 / Complete share link / Liên kết chia sẻ đầy đủ</label>
        <input id="share-link" type="url" required autocomplete="off" spellcheck="false" placeholder="https://…/#key=…">
        <button type="submit">開啟 / Open / Mở</button><button id="retry" type="button">重試 / Retry / Thử lại</button>
      </form>
    </section>
    <noscript>請啟用 JavaScript。 / Enable JavaScript. / Hãy bật JavaScript.</noscript>
  </main>
  <iframe id="viewer" title="CAM Workbench" hidden></iframe><script src="launch.js"></script>
</body>
</html>
